version: 2

updates:
  # The actions decree's workflows use. Each is pinned to a full commit SHA with its version as
  # a comment, which CI's "Action pins" job checks (scripts/check_action_pins.exs); Dependabot
  # moves the SHA and the comment together. One group, so one PR bumps every workflow.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Oslo"
    commit-message:
      prefix: ":arrow_up:"
    groups:
      all-actions:
        patterns:
          - "*"
