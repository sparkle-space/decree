name: Prepare release

# Opens the release PR: mix.exs's version bumped, the CHANGELOG's Unreleased section moved
# under it and, on a minor or major bump, the version references in README.md, SECURITY.md
# and the CHANGELOG preamble moved (scripts/release.exs bump). Merging it starts the Publish workflow.
# CONTRIBUTING.md, "Releases", describes the flow, the release App and the pre-1.0 version rules.
#
# GitHub starts no workflow on a pull request that a workflow's own GITHUB_TOKEN opened, so
# the release branch is pushed and the PR opened with an installation token of decree's
# release GitHub App, and CI runs on the PR. The token is minted for this run only, with
# contents and pull-requests write on this repository, and revoked when the job ends. The
# App's Client ID (variable RELEASE_APP_CLIENT_ID) and private key (secret
# RELEASE_APP_PRIVATE_KEY) live in the release-pr environment, which only main can use.
# Without them the run stops at its first step; it does not fall back to GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch: a fix or an additive change. minor: a breaking change (before 1.0). major: 1.0.0, the founder's call."
        type: choice
        options: [patch, minor, major]
        required: true
      confirm_1_0:
        description: "Confirm a major bump from 0.x to 1.0.0 (founder only)"
        type: boolean
        default: false

permissions: {}

env:
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-pr
    # The job's own token only reads. The App's token pushes the branch and opens the PR.
    permissions:
      contents: read

    steps:
      # The key's value stays out of this step: it sees only whether the secret is set.
      - name: Check that the release App is configured
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          missing=0
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::the variable RELEASE_APP_CLIENT_ID is not set in the release-pr environment. Set it to the release GitHub App's Client ID (CONTRIBUTING.md, \"Releases\")."
            missing=1
          fi
          if [ "$HAS_PRIVATE_KEY" != "true" ]; then
            echo "::error::the secret RELEASE_APP_PRIVATE_KEY is not set in the release-pr environment. Set it to a private key of the release GitHub App (CONTRIBUTING.md, \"Releases\")."
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Bump the version and move the Unreleased section
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          CONFIRM_1_0: ${{ inputs.confirm_1_0 }}
        run: |
          args=(bump "$BUMP")
          if [ "$CONFIRM_1_0" = "true" ]; then
            args+=(--confirm-1-0)
          fi
          version=$(elixir scripts/release.exs "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git diff

      - name: Refuse a version that is already tagged or has a branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::the tag v$VERSION already exists"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/release/v$VERSION" > /dev/null; then
            echo "::error::the branch release/v$VERSION already exists; close its PR and delete it first"
            exit 1
          fi

      - name: Write the PR body
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ steps.bump.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Bumps decree to $VERSION ($BUMP) and moves the CHANGELOG's Unreleased section under it. A minor or major bump also moves the version references in README.md, SECURITY.md and the CHANGELOG preamble. Opened by the [Prepare release]($RUN_URL) workflow."
            echo
            echo "Before merging:"
            echo
            echo "- Wait for CI to pass. It starts by itself: the workflow opened this PR with the release App's token."
            echo "- Check the notes below. They become the GitHub release body."
            echo
            echo "Merging starts the Publish workflow. It runs the gates, then waits for approval in the \`hex-publish\` environment before it tags v$VERSION and publishes to Hex."
            echo
            echo "## Release notes"
            echo
            elixir scripts/release.exs notes "$VERSION"
          } > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md"

      # Minted after the bump, so the token lives only for the push and the PR. The action
      # masks it in the log and revokes it when the job ends.
      - name: Mint the release App's token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push the release branch and open the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add mix.exs CHANGELOG.md README.md SECURITY.md
          git commit -m ":bookmark: Release decree $VERSION"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title ":bookmark: Release decree $VERSION" --body-file "$RUNNER_TEMP/body.md"
